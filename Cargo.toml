[workspace]
resolver = "2"
# rs-iot 主 crate（root）+ AI Agent 集成新增的独立 crate。
# - rsiot-mcp：reasonix 的 [[plugins]] 子进程，把 MCP 工具调用翻译成 rs-iot REST（照 dbx-mcp 范本）。
# - rsiot-gateway：v3 独立 API Gateway，纯反代 rs-iot + reasonix serve（照 plan-gateway-tech-selection.md）。
# 两个子 crate 与主 crate 解耦：核心数据流（pipeline/lux/采集）零改动是硬约束。
members = [".", "crates/rsiot-mcp", "crates/rsiot-gateway"]

[workspace.package]
edition = "2021"
# MSRV 1.96：default feature eip 的 rust-ethernet-ip 1.2 要求（--no-default-features 裁剪后可降）。
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/viccom/rs-iot"

[package]
name = "rs-iot"
version = "0.1.0"
edition = { workspace = true }
rust-version = { workspace = true }
description = "Lightweight cross-platform industrial IoT edge framework (Rust), with embedded lux as an in-process Redis-compatible database."
license = { workspace = true }
repository = { workspace = true }

[dependencies]
# 嵌入式内存数据库：对外 RESP + Tiered 持久化
lux = { path = "../lux" }
# 历史时序存储引擎（Phase 1b 写路径终态存储；path 依赖同级 fork，跟随其 master——
# 无版本锚，与本地开发和 CI 一致）。仅 feature `history` 引入，默认构建依赖面零变化。
tsink = { path = "../tsink_fork", optional = true }

# 异步运行时
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt", "codec"] }
# SSE 实时推送(阶段一):broadcast → Stream(BroadcastStream,需 sync feature)。
tokio-stream = { version = "0.1", features = ["sync"] }

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# log → tracing 桥（F-8）：上游协议库（tokio-s7 全篇 log::info!/warn! 等）的日志
# 只有装了 LogTracer 才能进 tracing subscriber，否则静默丢弃。
tracing-log = "0.2"

# 错误
anyhow = "1"
thiserror = "2"

# 序列化 / 配置。
# +rc:EventPayload::Log 用 Arc<LogEntry>(N 个 SSE 客户端共享同一份日志,避免深拷贝)。
# LogEntry 树状无 cycle,启用 Arc/Rc 序列化安全。
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
toml = "0.8"

# 系统 / 硬件 ID
sysinfo = "0.32"
sha2 = "0.10"

# D-SEC-1 secrets 值 AEAD 加密存储：chacha20poly1305 + HKDF-SHA256(jwt_secret)。
# 版本对齐树内（hkdf 0.12/base64 0.22 经 jsonwebtoken 栈 lock 已有，不新增编译；
# hkdf 0.13 强制 sha2 0.11，会连带 hwid/ext_token 迁移，不值）；chacha20 0.10 树内已有。
chacha20poly1305 = "0.11"
hkdf = "0.12"
base64 = "0.22"

# CLI
clap = { version = "4", features = ["derive"] }

# 身份认证（与 lux 对齐版本，减少重复编译）
bcrypt = "0.17"

# trait async
async-trait = "0.1"

# M2: 插件系统 + MQTT 北向 + 数据转换
rumqttc = { version = "0.25", features = ["url"] }
# 阶段 D H1：luaNorth insecure_tls 需自建 dangerous verifier 注入 rumqttc
# （0.25 无 set_insecure API；0.23.43 起 dangerous API 无条件导出，不再需要
# dangerous_configuration feature）。版本与树内一致（0.23.43），不新增编译。
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
# H1 无 ca_path 分支加载系统根证书（与 rumqttc 内部依赖同版本，lock 已有）。
rustls-native-certs = "0.8"
inventory = "0.3"
dashmap = "6"
rhai = { version = "1.25", optional = true }
chrono = "0.4"

# M3: REST 管理 API + JWT + 静态前端嵌入
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
# 加密提供方须与 lux 全局唯一（jsonwebtoken 10 的 rust_crypto/aws_lc_rs 二选一；
# lux ≥0.37.1 用 aws_lc_rs，feature 合一后若两侧各启一个 → 运行时 panic
# "Could not automatically determine the process-level CryptoProvider"）。
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
rust-embed = { version = "8", features = ["mime-guess"] }
mime_guess = "2"

# OPC UA 南向插件（async-opcua：freeopcua 社区接棒 locka99 的现代纯 async 实现）
async-opcua = { version = "0.19", default-features = false, features = ["client"], optional = true }
# 进程内 OPC UA server（opcuaClient OPC-9 订阅 e2e 用）。放 [dependencies] 而
# 非 [dev-dependencies] 是因为 cargo 不允许 dev-deps optional——用 optional +
# feature `opcua-e2e` 门控达到等价效果：default/裁剪构建不编译，lib 代码不引用它，
# release 依赖面零变化；与 async-opcua(client) 同源共用 opcua-types。
async-opcua-server = { version = "0.19", optional = true }

# 文件日志（tokio-rs 官方 appender，RollingFileAppender daily 轮转 + non_blocking）
tracing-appender = "0.2"

# Modbus 南向插件（tokio-modbus：纯 async，client-only；tcp + rtu 协议编解码）。
# RTU over serial 单独依赖 tokio-serial（SerialStream 实现 tokio AsyncRead+AsyncWrite）。
tokio-modbus = { version = "0.17", default-features = false, features = ["tcp", "rtu"], optional = true }
# tokio-serial 保持无条件依赖：lua_client（默认开启）的串口 IO 也依赖它（B1 方案，
# 详见 docs/decisions/2026-08-07-feature-gating-protocols.md §2.2）。仅随 modbus 一起 gate 会破坏 lua serial。
tokio-serial = "5.5"

# S7 南向插件（tokio-s7：纯 Rust async，ISO-on-TCP，西门子 S7-200/200Smart/300/400/1200/1500/Sinumerik828D；
# Apache-2.0 与 MIT 兼容无传染；无 FFI/无系统库，跨平台编译零额外依赖）。
tokio-s7 = { version = "0.1", optional = true }

# EtherNet/IP 南向插件（eipClient：rust-ethernet-ip，罗克韦尔 AB CompactLogix/ControlLogix；
# MIT；纯 TCP 无特殊驱动，跨平台；真实 PLC 硬件验证见 crate 1.2.0 validation docs）。
rust-ethernet-ip = { version = "1.2", optional = true }

# 外部插件 bridge（sidecarClient）：token hmac 校验 + 高熵 token 生成 + 长度前缀帧
hmac = "0.12"
rand = "0.8"
bytes = "1"
futures-util = "0.3"

# Lua 动态脚本采集（luaClient）：mlua 0.12，Lua 5.4 vendored 编入，async+send 桥接 tokio。
# send 是必需的（rs-iot multi_thread runtime 下 spawn 持 Lua 的 future 须 Send）。
mlua = { version = "0.12", features = ["lua54", "vendored", "async", "send", "serde", "macros"], optional = true }

# Lua 脚本 HTTP 出站（lua-http feature，默认开启）：reqwest rustls-tls，不拉 OpenSSL。
# json feature 供 http_post body 序列化（v1 直接传文本 body，json feature 备用）。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"], optional = true }

# Lua 脚本热加载（lua feature）：notify 监听 scripts/ 写类改动（事件类别过滤 +
# 自绘 200ms 去抖——notify-debouncer-mini 0.7 丢弃事件类别，notify 8 掩码含 IN_OPEN，
# 读脚本即触发 reload 自激风暴，2026-10-26 实证后弃用，见 lua_core/hotload.rs）。
notify = { version = "8", optional = true }

# Lua stdlib 官方源 index 验签（lua feature，设计 §3.5/§3.7 供应链对策）：
# ed25519-dalek 2 默认特性带 rand_core/zeroize，裁掉只留 std（sync 一次验一签，无需 fast 后端）。
ed25519-dalek = { version = "2", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
# tokio test-util（start_paused 虚拟时钟）：护栏超时类测试加速（如 lua send 2s 背压
# 丢样），仅测试构建启用 feature，release 产物不含。
tokio = { version = "1", features = ["test-util"] }
# 集成测试（e2e_modbus_full_e2e 等）直接用 reqwest 打 REST——lib 侧 reqwest 是
# lua-http optional 依赖，裁剪组合（--no-default-features --features lua）下若无
# dev-dep 兜底，测试目标编译失败（CI minimal job 存量红，2026-08-20 修复）。
# dev-deps 只进测试构建，不影响 release feature 面；lua-http 开启时与 lib 依赖同源合并。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# 进程内 MQTT broker（阶段 B T10 契约 e2e：luaNorth 全链路连真 broker 语义跑默认
# 套件，不再依赖外部 mosquitto/EMQX）。仅 dev-deps——release 依赖面零变化；
# rumqttd 最新发布即 0.20（crates.io 无 0.24，与 rumqttc 0.25 版本号不同步是
# 上游发布节奏问题，两者为独立 crate 无版本耦合）。default-features = false 裁掉
# rustls/websocket——测试只用明文 TCP v4 listener。
rumqttd = { version = "0.20", default-features = false }

[features]
# 默认编译面（2026-08-26 用户裁决）：datasim(无条件)+lua/lua-http+modbus+opcua。
# s7/eip 出默认——显式 `--features s7,eip` 启用（find_source 优雅降级不变）；
# transform（Q7 冻结不接线）同样出默认，留 feature 供未来解冻。
default = ["lua", "lua-http", "opcua", "modbus"]
# L2 数据转换（rhai 脚本——已冻结 deprecated：Q7 定案不接线不投入，数据加工走 luaTransform）
transform = ["dep:rhai"]
# Lua 动态脚本采集（luaClient，默认开启）；ed25519-dalek = stdlib sync index 验签（T9）
lua = ["dep:mlua", "dep:notify", "dep:ed25519-dalek"]
# Lua HTTP 出站（ctx:http_get/http_post，默认随 lua 开；独立可关以裁 release / 减出站风险面）
lua-http = ["lua", "dep:reqwest"]
# 内置南向协议插件（默认全开，向后兼容）。现场可 `--no-default-features --features "..."` 按需裁剪
# （减体积 / 省系统依赖）。关掉某协议后，该 app_code 建实例会返回 "source plugin not found"
# （find_source 优雅降级，非崩溃）。详见 docs/decisions/2026-08-07-feature-gating-protocols.md。
opcua = ["dep:async-opcua"]
modbus = ["dep:tokio-modbus"]
s7 = ["dep:tokio-s7"]
eip = ["dep:rust-ethernet-ip"]
# 历史时序存储写路径（Phase 1b）：旁路 fan-out → 有界 channel → 单写线程 → tsink。
# L1 编译期开关（L2=[history].enabled、L3=TagProps.history）；不进 default，
# 默认/裁剪构建不拉 tsink。见 docs/designs/2026-08-25-history-write-path-plan.md。
history = ["dep:tsink"]
# opcuaClient 订阅 e2e（OPC-9）：进程内 async-opcua-server 真实联调（订阅首值/
# 变化推送/写回执）。测试专用，不进 default；需与 opcua 同开（`--features
# "opcua,opcua-e2e"`），默认 feature 面已含 opcua。
opcua-e2e = ["dep:async-opcua-server"]
# 预留（后续里程碑）：
# local-broker = ["dep:rumqttd"]
# analytics = ["dep:datafusion"]
# windows-svc = ["dep:windows-service"]

# 第三方库最小 fork（2026-11-01 协议语义审查决策）：tokio-s7 0.1.7 的 4 处上游缺陷
# S-1（写应答 item 级 return code 被丢弃）/ S-4（头级错误区解析错位）/
# S-5（STRING UTF-8 lossy）/ S-9（connection_type 死配置）。fork 版本号保持 0.1.7，
# 只覆盖来源；上游合入后删本段即回退 crates.io。详见
# docs/decisions/2026-11-01-upstream-library-fork-policy.md §4/§9。
# 源用 GitHub 公开镜像（CI 匿名可达）；内部镜像同步在
# git.metme.top/viccom/tokio-s7（同分支）。本机拉取走 git CLI + SSH 443
# （.cargo/config.toml + git insteadOf，见决策 §9）。
[patch.crates-io]
tokio-s7 = { git = "https://github.com/viccom/tokio-s7.git", branch = "rs-iot/fixes" }

[profile.release]
# workspace 层共享（rs-iot + rsiot-mcp + rsiot-gateway 复用同一 release 配置）。
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
# 不设 panic = "abort"，保留 unwind 以支持优雅关闭

[profile.dev]
# debuginfo 瘦身（2026-11-09）：line-tables-only 只保留回溯所需的 文件:行号 表，
# 去掉变量/类型完整细节——单二进制从 ~550MB 降到数十 MB；调试器断点检查变量时
# 信息会变粗，需要完整细节时临时用 `cargo build --profile dev-full`（见下）。
debug = "line-tables-only"

# 完整 debuginfo 的开发 profile（需要单步调试看变量时用）：
# cargo build --profile dev-full
[profile.dev-full]
inherits = "dev"
debug = true

# Windows Service（仅 windows target）
[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
# SetConsoleCtrlHandler:监听 CTRL_C + CTRL_BREAK(后者供 warden 等监护器经
# GenerateConsoleCtrlEvent 发给独立 process group 触发 graceful SAVE)
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }

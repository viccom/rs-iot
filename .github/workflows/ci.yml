name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  # 注意：RUSTFLAGS 全仓生效会连带 path 依赖（../lux）的 deprecated 告警一起变错。
  # 因此警告严格化只在本仓代码上生效：各 job 用 `-- -D warnings`（clippy）而非全局 RUSTFLAGS。
  CARGO_TERM_COLOR: always

# ── 私有 path 依赖与检出布局（2026-11-25 方案①）──────────────────────────────
# rs-iot 依赖两个同级库：../lux（必需；lux-db/lux 0.37.1 + 本地补丁，私有）与
# ../tsink_fork（仅 history feature；viccom/tsink，公开）。
#
# 布局：actions/checkout 不允许检出到工作区之外，所以用到 Rust 的 job 一律是
#   $GITHUB_WORKSPACE/{rs-iot, lux, tsink_fork}
# ——本仓检出到子目录 rs-iot/，lux、tsink 检出到它的同级；各 job 以
# defaults.run.working-directory 进 rs-iot/ 执行 cargo。
# （2026-11-25 之前 lux/tsink 写成 path: ../lux、../tsink_fork，被 checkout 以
#   "Repository path … is not under …" 拒绝——Rust job 自 CI 建立以来从未跑通过。）
#
# 私有依赖 viccom/lux 经 **deploy key（SSH）** 拉取：仓库 secret `LUX_DEPLOY_KEY`
# 存的是 CI 专用私钥，其公钥以**只读 deploy key** 挂在 viccom/lux 上
# （Settings → Deploy keys，read-only）。凭据在协议层只对该仓有效、只读、无到期
# （优于 fine-grained PAT：PAT 的「只读」靠配置约束、且最长 90 天要续）。
# secret 缺失、deploy key 被删或被改成 RW 之外的状态时，Rust job 在「Checkout lux」
# 一步失败。lux 镜像的建立与同步、deploy key 的办理与轮换，见
# docs/ops/lux-upstream-sync-strategy.md「CI 可达性」。
#
# tsink 检出 viccom/tsink 的 master：rs-iot 的 path 依赖没有版本锚，本地开发与部署
# 用的都是 master；旧基线标签 rs-iot-1b-baseline 停在 2026-08-25，已不适用。
# 它是公开仓库，检出时不传凭据（SSH 私钥只对 lux 生效）。
#
# docs / frontend / audit 三个 job 不依赖这两个库，恒定可跑。
#
# 「Install libudev-dev」对 `apt-get update` 的失败宽容：runner 镜像里预置的
# packages.microsoft.com 源偶发 403（与本仓无关；2026-11-27 实测 ubuntu-latest
# 的 test 作业因此整个挂在装包一步）。Ubuntu 官方源此时已取到列表，故 update
# 失败不再中断流程，而 install 仍是硬失败——包装不上照样红。

jobs:
  fmt:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rs-iot
    steps:
      - uses: actions/checkout@v4
        with:
          path: rs-iot
      - name: Checkout lux (private path dep)
        uses: actions/checkout@v4
        with:
          repository: viccom/lux
          ref: main
          path: lux
          ssh-key: ${{ secrets.LUX_DEPLOY_KEY }}
      - name: Checkout tsink (path dep, history feature)
        uses: actions/checkout@v4
        with:
          repository: viccom/tsink
          ref: master
          path: tsink_fork
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rs-iot
    steps:
      - uses: actions/checkout@v4
        with:
          path: rs-iot
      - name: Checkout lux (private path dep)
        uses: actions/checkout@v4
        with:
          repository: viccom/lux
          ref: main
          path: lux
          ssh-key: ${{ secrets.LUX_DEPLOY_KEY }}
      - name: Checkout tsink (path dep, history feature)
        uses: actions/checkout@v4
        with:
          repository: viccom/tsink
          ref: master
          path: tsink_fork
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # serialport/tokio-serial（RTU over serial）在 Linux 链接 libudev，需头文件。
      - name: Install libudev-dev (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -o Acquire::Retries=3 || true
          sudo apt-get install -y libudev-dev
      # 全开档
      - name: clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings
      # 默认档（现场默认编译面 = lua,lua-http,opcua,modbus）
      - name: clippy (default features)
        run: cargo clippy --all-targets -- -D warnings
      # 最小裁剪档（lua-only，最小现场）
      - name: clippy (lua only)
        run: cargo clippy --no-default-features --features lua --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rs-iot
    steps:
      - uses: actions/checkout@v4
        with:
          path: rs-iot
      - name: Checkout lux (private path dep)
        uses: actions/checkout@v4
        with:
          repository: viccom/lux
          ref: main
          path: lux
          ssh-key: ${{ secrets.LUX_DEPLOY_KEY }}
      - name: Checkout tsink (path dep, history feature)
        uses: actions/checkout@v4
        with:
          repository: viccom/tsink
          ref: master
          path: tsink_fork
      - uses: dtolnay/rust-toolchain@stable
      - name: Install libudev-dev (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -o Acquire::Retries=3 || true
          sudo apt-get install -y libudev-dev
      - run: cargo test --all-targets --all-features

  minimal:
    # 验证裁剪组合可编译：关掉三协议，覆盖最小现场部署（lua 脚本采集）。
    # 防止 feature 化后裁剪组合悄悄编译失败却无人发现（docs/decisions/2026-08-07-feature-gating-protocols.md R4）。
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rs-iot
    steps:
      - uses: actions/checkout@v4
        with:
          path: rs-iot
      - name: Checkout lux (private path dep)
        uses: actions/checkout@v4
        with:
          repository: viccom/lux
          ref: main
          path: lux
          ssh-key: ${{ secrets.LUX_DEPLOY_KEY }}
      - name: Checkout tsink (path dep, history feature)
        uses: actions/checkout@v4
        with:
          repository: viccom/tsink
          ref: master
          path: tsink_fork
      - uses: dtolnay/rust-toolchain@stable
      - name: Install libudev-dev (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -o Acquire::Retries=3 || true
          sudo apt-get install -y libudev-dev
      # test（非 build）：让 feature_gate_e2e（#![cfg(not(feature = "modbus"))]）在
      # 裁剪组合下执行，验证关协议时优雅降级（R1）；同时回归保护裁剪组合下其他测试。
      - run: cargo test --no-default-features --features lua
      # modbus 开启 → feature_gate_e2e 被 cfg 跳过；此处仅验证该组合可编译。
      - run: cargo build --no-default-features --features "lua,modbus,opcua"
      # s7/eip 出默认后的门禁档（ADR default-compile-surface:9 声称的"新增档"，
      # 此前 ci.yml 中并不存在——审查 P1 补齐）。
      - name: s7/eip 裁剪档 e2e
        run: cargo test --features "s7,eip" --test s7_e2e --test eip_client_e2e --test feature_gate_e2e

  doc:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rs-iot
    steps:
      - uses: actions/checkout@v4
        with:
          path: rs-iot
      - name: Checkout lux (private path dep)
        uses: actions/checkout@v4
        with:
          repository: viccom/lux
          ref: main
          path: lux
          ssh-key: ${{ secrets.LUX_DEPLOY_KEY }}
      - name: Checkout tsink (path dep, history feature)
        uses: actions/checkout@v4
        with:
          repository: viccom/tsink
          ref: master
          path: tsink_fork
      - uses: dtolnay/rust-toolchain@stable
      - name: Install libudev-dev (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -o Acquire::Retries=3 || true
          sudo apt-get install -y libudev-dev
      - run: cargo doc --no-deps --all-features

  frontend:
    # 前端类型 + 单测 + 构建门禁（审查 P1：rust-embed 产物此前零 CI 覆盖）。
    # 不依赖 lux/tsink，恒定可执行。
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test -- --run
      - run: npm run build

  docs:
    # 文档体系校验：头部状态块/实施块字段/索引登记与状态对齐/相对链接有效性。
    # 分层依赖门禁：生产段模块图无环 + 禁止越层引用。
    # 规则见 docs/conventions/documentation.md 与 docs/architecture.md §四；不依赖 lux/rust，秒级完成。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_docs.py
      - run: python scripts/check_layers.py

  # audit 硬门禁（2026-11-27 起，替代原先的 continue-on-error 信息性作业）：
  # 兼容性范围内的 20 条漏洞已由 Cargo.lock 精准升级清掉（lock 中 quinn*/rustls*/
  # url/webpki-roots/zstd* 一族）；剩余 9 条逐一 --ignore（理由与解除条件见下方
  # 注释）。此后**新增**漏洞不在清单内 → 本作业红——不再有"信息性失败"这种漏看方式。
  # 维护义务：每条 ignore 的解除条件到期（依赖升级）时应删除对应行。
  #
  # 设计取舍：不使用 --deny warnings。unmaintained/unsound/yanked 类警告当前
  # 有 17 条（heapless 0.7 unsound ×8、rhai→smartstring、tsink→bincode 1.3、
  # async-opcua→chrono、rumqttc→rustls-pemfile、postcard→atomic-polyfill 等，
  # 全是无修复版本的传递依赖），--deny warnings 会把它们全部变成失败，噪音大于
  # 信号。它们仍完整打印在本作业日志里供人工审阅；哪条将来出了漏洞变体，会以
  # 漏洞身份真红。
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: |
          cargo audit \
            --ignore RUSTSEC-2026-0049 \
            --ignore RUSTSEC-2026-0098 \
            --ignore RUSTSEC-2026-0099 \
            --ignore RUSTSEC-2026-0104 \
            --ignore RUSTSEC-2026-0382 \
            --ignore RUSTSEC-2026-0457 \
            --ignore RUSTSEC-2026-0462 \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2026-0387

  # ── ignore 清单的理由与解除条件 ──────────────────────────────────────────
  # B 类 —— rustls-webpki 0.102.x（rumqttc 0.25.1 锁死该线，已停更）：
  #   RUSTSEC-2026-0049 / 0098 / 0099 / 0104 / 0382
  #   影响：仅 [mqtt] 走 TLS（8883）的证书校验路径；当前部署 broker 明文
  #   1883（warden 路径级配置同），实际风险≈0。
  #   解除：rumqttc 升级放开 webpki 0.103 后删这 5 行。
  # C 类 —— 需要上游/大版本迁移：
  #   RUSTSEC-2026-0457 / 0462（rmcp 2.2 → ≥3.9）：rsiot-mcp 直接依赖，2→3 为
  #     breaking，单独立项迁移；触达面是本地 stdio MCP server。
  #   RUSTSEC-2023-0071（rsa 0.9 → ≥0.10）：经 async-opcua 0.19 传递；Marvin
  #     类攻击针对持私钥的服务端，rs-iot 是 OPC UA 客户端、不持受影响私钥。
  #     解除：async-opcua 升 rsa 0.10。
  #   RUSTSEC-2026-0387（crypto-bigint 0.5 → ≥0.7.6）：经 lux 的 p256/JWT
  #     ECDSA 链；常时运算时序变异需同机高精度测量才有实际意义。
  #     解除：RustCrypto 生态新 major（随 lux 上游升级）。

name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  # 注意：RUSTFLAGS 全仓生效会连带 path 依赖（../lux）的 deprecated 告警一起变错。
  # 因此警告严格化只在本仓代码上生效：各 job 用 `-- -D warnings`（clippy）而非全局 RUSTFLAGS。
  CARGO_TERM_COLOR: always

# ── 私有 path 依赖前提（2026-10-27 审查 P1 修正说明）────────────────────────
# rs-iot 依赖两个同级私有库：../lux（必需）与 ../tsink_fork（仅 history feature）。
# 本 workflow 用 `RUST_DEPS_TOKEN`（org/repo secret）拉取；**秘密未配置时 checkout 会
# 立即失败并打印本注释指引**——这正是此前的沉默失效点（viccom/lux 在 GitHub 匿名 404，
# 五个 Rust job 从未跑通过）。
# 三种部署选择（自行裁决其一，见 CLAUDE.md「CI 私有依赖」节）：
#   ① 配 RUST_DEPS_TOKEN（repo scope，可读 viccom/lux 与 viccom/tsink）；
#   ② 把 luc/tsink 镜像到公开托管点，改下面的 repository 字段；
#   ③ 承认单机开发现实 → 删除 Rust jobs，只保留 docs / frontend / audit
#      （本地门禁 = `just check`，已覆盖 fmt/docs/lint/test）。
# 无论选哪种，`docs` 与 `frontend` 两个 job 都不依赖私有库，恒定可跑。

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # lux 为 path 依赖（../lux）；CI 一并 checkout（仓库名按实际 GitHub org 调整）
      - name: Checkout lux (private path dep)
        uses: actions/checkout@v4
        with:
          repository: viccom/lux
          path: ../lux
          token: ${{ secrets.RUST_DEPS_TOKEN }}
      # tsink 为 path 依赖(../tsink_fork);CI 一并 checkout(pin 基线)
      - name: Checkout tsink (private path dep, pin baseline)
        uses: actions/checkout@v4
        with:
          repository: viccom/tsink
          ref: rs-iot-1b-baseline
          path: ../tsink_fork
          token: ${{ secrets.RUST_DEPS_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout lux (private path dep)
        uses: actions/checkout@v4
        with:
          repository: viccom/lux
          path: ../lux
          token: ${{ secrets.RUST_DEPS_TOKEN }}
      # tsink 为 path 依赖(../tsink_fork);CI 一并 checkout(pin 基线)
      - name: Checkout tsink (private path dep, pin baseline)
        uses: actions/checkout@v4
        with:
          repository: viccom/tsink
          ref: rs-iot-1b-baseline
          path: ../tsink_fork
          token: ${{ secrets.RUST_DEPS_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # serialport/tokio-serial（RTU over serial）在 Linux 链接 libudev，需头文件。
      - name: Install libudev-dev (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      # 全开档
      - name: clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings
      # 默认档（现场默认编译面 = lua,lua-http,opcua,modbus）
      - name: clippy (default features)
        run: cargo clippy --all-targets -- -D warnings
      # 最小裁剪档（lua-only，最小现场）
      - name: clippy (lua only)
        run: cargo clippy --no-default-features --features lua --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout lux (private path dep)
        uses: actions/checkout@v4
        with:
          repository: viccom/lux
          path: ../lux
          token: ${{ secrets.RUST_DEPS_TOKEN }}
      # tsink 为 path 依赖(../tsink_fork);CI 一并 checkout(pin 基线)
      - name: Checkout tsink (private path dep, pin baseline)
        uses: actions/checkout@v4
        with:
          repository: viccom/tsink
          ref: rs-iot-1b-baseline
          path: ../tsink_fork
          token: ${{ secrets.RUST_DEPS_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install libudev-dev (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - run: cargo test --all-targets --all-features

  minimal:
    # 验证裁剪组合可编译：关掉三协议，覆盖最小现场部署（lua 脚本采集）。
    # 防止 feature 化后裁剪组合悄悄编译失败却无人发现（docs/decisions/2026-08-07-feature-gating-protocols.md R4）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout lux (private path dep)
        uses: actions/checkout@v4
        with:
          repository: viccom/lux
          path: ../lux
          token: ${{ secrets.RUST_DEPS_TOKEN }}
      # tsink 为 path 依赖(../tsink_fork);CI 一并 checkout(pin 基线)
      - name: Checkout tsink (private path dep, pin baseline)
        uses: actions/checkout@v4
        with:
          repository: viccom/tsink
          ref: rs-iot-1b-baseline
          path: ../tsink_fork
          token: ${{ secrets.RUST_DEPS_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install libudev-dev (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      # test（非 build）：让 feature_gate_e2e（#![cfg(not(feature = "modbus"))]）在
      # 裁剪组合下执行，验证关协议时优雅降级（R1）；同时回归保护裁剪组合下其他测试。
      - run: cargo test --no-default-features --features lua
      # modbus 开启 → feature_gate_e2e 被 cfg 跳过；此处仅验证该组合可编译。
      - run: cargo build --no-default-features --features "lua,modbus,opcua"
      # s7/eip 出默认后的门禁档（ADR default-compile-surface:9 声称的"新增档"，
      # 此前 ci.yml 中并不存在——审查 P1 补齐）。
      - name: s7/eip 裁剪档 e2e
        run: cargo test --features "s7,eip" --test s7_e2e --test eip_client_e2e --test feature_gate_e2e

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout lux (private path dep)
        uses: actions/checkout@v4
        with:
          repository: viccom/lux
          path: ../lux
          token: ${{ secrets.RUST_DEPS_TOKEN }}
      # tsink 为 path 依赖(../tsink_fork);CI 一并 checkout(pin 基线)
      - name: Checkout tsink (private path dep, pin baseline)
        uses: actions/checkout@v4
        with:
          repository: viccom/tsink
          ref: rs-iot-1b-baseline
          path: ../tsink_fork
          token: ${{ secrets.RUST_DEPS_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install libudev-dev (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - run: cargo doc --no-deps --all-features

  frontend:
    # 前端类型 + 单测 + 构建门禁（审查 P1：rust-embed 产物此前零 CI 覆盖）。
    # 不依赖 lux/tsink，恒定可执行。
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test -- --run
      - run: npm run build

  docs:
    # 文档体系校验：头部状态块/实施块字段/索引登记与状态对齐/相对链接有效性。
    # 规则见 docs/conventions/documentation.md；不依赖 lux/rust，秒级完成。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_docs.py

  audit:
    runs-on: ubuntu-latest
    # 信息性：传递依赖（rustls TLS 链，经 rumqttc/lux 引入）当前有已知 advisory
    # （rustls-webpki 0.102.8 / rustls-pemfile 2.2.0 等）；rs-iot 用明文 MQTT
    # （broker:1883，TLS 路径未启用）实际风险低。升级 lux/rumqttc 依赖链后
    # 移除 continue-on-error 改为严格。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit

[package]
name = "rsiot-gateway"
version = "0.1.0"
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
description = "v3 独立 API Gateway：纯反代 rs-iot + reasonix serve，统一前端入口（照 plan-gateway-tech-selection.md）"
repository = { workspace = true }

[[bin]]
name = "rsiot-gateway"
path = "src/main.rs"

[dependencies]
# 与 rs-iot 同版本栈（gateway 复用，零新增心智）。见根 Cargo.toml:56-60。
# multipart：附件上传端点（/api/agent/attachments）需要 Multipart extractor。
axum = { version = "0.8", features = ["macros", "multipart"] }
tower = "0.5"
# fs：/hmi agent-hmi 静态挂载的 ServeDir（W2，可配 hmi_dist）。
tower-http = { version = "0.6", features = ["trace", "cors", "fs"] }
# stream feature 必加：SSE 裸字节流透传用 bytes_stream()（plan-gateway-tech-selection.md §五关键决策）。
# rs-iot 主 crate 的 reqwest 是 optional + lua-http 无 stream，gateway 独立声明带 stream。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
# 复用 rs-iot JWT（层1 鉴权共享 jwt_secret，plan-gateway-tech-selection.md §四层1）。
# 加密提供方必须全工作区唯一（jsonwebtoken 10 二选一）：与根 Cargo.toml 对齐用
# aws_lc_rs——若两侧各启一个（rust_crypto/aws_lc_rs），任何把两个 crate 合并解析的
# 构建命令（如 `cargo build -p rsiot-gateway -p rs-iot`）会 feature 联合出双提供方，
# 运行时 panic "Could not automatically determine the process-level CryptoProvider"
# （2026-10-28 部署实测；分条 -p 构建不触发，具隐蔽性）。
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# 供应商管理：外科手术式编辑 reasonix config.toml（保留注释/格式，勿用 serde 全量重写）。
toml_edit = "0.22"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
bytes = "1"
futures-util = "0.3"
# 静态前端嵌入（与 rs-iot 主 crate 同栈，对标 src/api/frontend.rs）。
# rust-embed 编译时把 frontend/dist 嵌入二进制，gateway 独立部署不需随附静态文件。
rust-embed = { version = "8", features = ["mime-guess"] }
mime_guess = "2"
# 附件落盘文件名的时间戳部分（与 reasonix clipboard-* 命名同款可读格式）。
chrono = "0.4"

[dev-dependencies]
# 集成测试签 JWT exp 时间戳（B1-1 SSE 透传端到端测）。
chrono = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync"] }

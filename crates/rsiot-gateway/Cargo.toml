[package]
name = "rsiot-gateway"
version = "0.1.0"
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
description = "v3 独立 API Gateway：纯反代 rs-iot + reasonix serve，统一前端入口（照 plan-gateway-tech-selection.md）"
repository = { workspace = true }

[[bin]]
name = "rsiot-gateway"
path = "src/main.rs"

[dependencies]
# 与 rs-iot 同版本栈（gateway 复用，零新增心智）。见根 Cargo.toml:56-60。
# multipart：附件上传端点（/api/agent/attachments）需要 Multipart extractor。
axum = { version = "0.8", features = ["macros", "multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
# stream feature 必加：SSE 裸字节流透传用 bytes_stream()（plan-gateway-tech-selection.md §五关键决策）。
# rs-iot 主 crate 的 reqwest 是 optional + lua-http 无 stream，gateway 独立声明带 stream。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
# 复用 rs-iot JWT（层1 鉴权共享 jwt_secret，plan-gateway-tech-selection.md §四层1）。
# rust_crypto feature 与 rs-iot 对齐（根 Cargo.toml:59）。
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# 供应商管理：外科手术式编辑 reasonix config.toml（保留注释/格式，勿用 serde 全量重写）。
toml_edit = "0.22"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
bytes = "1"
futures-util = "0.3"
# 静态前端嵌入（与 rs-iot 主 crate 同栈，对标 src/api/frontend.rs）。
# rust-embed 编译时把 frontend/dist 嵌入二进制，gateway 独立部署不需随附静态文件。
rust-embed = { version = "8", features = ["mime-guess"] }
mime_guess = "2"
# 附件落盘文件名的时间戳部分（与 reasonix clipboard-* 命名同款可读格式）。
chrono = "0.4"

[dev-dependencies]
# 集成测试签 JWT exp 时间戳（B1-1 SSE 透传端到端测）。
chrono = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync"] }

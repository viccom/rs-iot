# rs-iot 配置示例（复制为 config.toml 后按需修改；config.toml 已被 .gitignore 忽略）
# 本机开发实例：config.toml 是**运行态实例配置**，不入库；模板只保留结构与占位值。
api_port = 8790                       # 默认值（2026-08-26 统一 8790），显式保留供现场调整
jwt_secret = "CHANGE_ME_strong_random_secret"   # 必改：默认弱密钥会在启动日志告警

[lux]
port = 6390
# 非 loopback 绑定必须配 password（启动期校验，缺则拒绝启动）
bind_host = "0.0.0.0"
password = "CHANGE_ME_lux_password"
data_dir = "./data/lux"
save_interval_secs = 300

[pipeline]
# worker 数。0 = auto（min(cpu,8)）。50万点/秒建议 auto 或 4-8。
# workers=1 退回单 worker（阶段1 形态）。
workers = 0

[mqtt]
# 公共 MQTT broker（匿名，开发/验证用；生产部署换私有 broker + credentials）
host = "broker.emqx.io"
port = 1883
# publish 周期（秒）。50万点下全量序列化压力大，建议 ≥2s；默认 5s 合理。
publish_interval_secs = 5

[bridge]
# 外部插件 bridge（sidecarClient）。默认关（现有部署零影响）；本机端到端验证时改 true。
enable = false
bind_host = "127.0.0.1"
port = 8781
heartbeat_timeout_secs = 30
accept_hello_timeout_secs = 10

# 日志（默认即可：落盘 ./logs，保留 7 天，daily 轮转，退出自动 flush）。
# 不写 [log] section 也走此默认（M3）。
[log]
dir = "./logs"        # 默认 "./logs"；置 "" 关闭文件层（仅终端）
level = "info"        # RUST_LOG 优先
max_days = 7          # 按文件名日期保留最近 N 天（0 = 不按天删）
max_size_mb = 0       # 0=不限；>0 时按目录总大小删最旧

# 历史时序存储（L2 部署期开关，2026-10-28 路线 A 启用；L1=--features history，
# L3=per-tag TagProps.history 白名单——须逐 tag 显式开启才归档）。其余字段走
# HistoryConfig 默认（内存 256MiB/保留 30d/WAL Periodic 500ms）。
[history]
enabled = true
data_dir = "./data/history"

# 画面/主题文档版本管理（P0，design 2026-10-30-screen-versioning）。
# 版本正文 TTL 自动淘汰旧版；每画面元数据超 2×cap 触发紧缩（保留最新 cap 条）。
[meta]
versions_ttl_secs = 2592000   # 正文 TTL，默认 30 天（0 视为默认）
versions_cap      = 50        # 每画面保留版本数上限（钳制 1..=500）
